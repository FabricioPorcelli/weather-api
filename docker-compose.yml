services:
  api:
    build: .
    container_name: weather-api
    expose:
      - "8000"
    env_file: .env
    environment:
      # Redis es externo (Coolify o un servicio aparte): se configura con REDIS_URL.
      REDIS_URL: ${REDIS_URL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s